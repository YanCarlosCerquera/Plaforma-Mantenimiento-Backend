<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Report Upload</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">Work Report Document Upload</h2>
        
        <div class="card">
            <div class="card-body">
                <form id="uploadForm" class="mb-4">
                    <div class="mb-3">
                        <label for="document" class="form-label">Upload Document (PDF/Word)</label>
                        <input type="file" class="form-control" id="document" accept=".pdf,.doc,.docx" required>
                    </div>
                    <div class="mb-3">
<!-- Modificación en el input de orderId en work-report.html -->
<input type="text" 
       id="orderId" 
       class="form-control" 
       required 
       pattern="[0-9a-fA-F]{24}" 
       title="Please enter a valid MongoDB ObjectId (24 hexadecimal characters)"
       placeholder="Enter Order ID (24 characters)">                        
                    </div>
                    <button type="submit" class="btn btn-primary">Upload and Process</button>
                </form>

                <div id="resultSection" class="hidden">
                    <h4 class="mb-3">Extracted Information</h4>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Costs</label>
                                <input type="number" class="form-control" id="costs" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Hours</label>
                                <input type="number" class="form-control" id="hours" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Responses</label>
                                <textarea class="form-control" id="responses" readonly rows="2"></textarea>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Observation</label>
                                <textarea class="form-control" id="observation" readonly rows="2"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Work Done</label>
                                <textarea class="form-control" id="workDone" readonly rows="2"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Status</label>
                                <input type="text" class="form-control" id="status" readonly>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="work-report.js"></script>
</body>
</html>
